<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Youzi Init Project - Cute Pomelo Logo">
  <title>Youzi Init Project</title>
  <desc>现代扁平插画风柚子 logo</desc>

  <defs>
    <!-- 果皮：清爽明黄渐变 -->
    <radialGradient id="peel" cx="40%" cy="32%" r="78%">
      <stop offset="0%"   stop-color="#FFEC8A"/>
      <stop offset="40%"  stop-color="#FFD93D"/>
      <stop offset="80%"  stop-color="#FFA94D"/>
      <stop offset="100%" stop-color="#F77F2A"/>
    </radialGradient>

    <!-- 顶部柔光 -->
    <radialGradient id="topLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 底部暖色反光 -->
    <radialGradient id="botGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFAA6A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFAA6A" stop-opacity="0"/>
    </radialGradient>

    <!-- 眼睛渐变 -->
    <radialGradient id="iris" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#6B5BFF"/>
      <stop offset="60%"  stop-color="#3D2DAA"/>
      <stop offset="100%" stop-color="#1A0F4D"/>
    </radialGradient>

    <!-- 叶子 -->
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#A8E063"/>
      <stop offset="100%" stop-color="#56AB55"/>
    </linearGradient>

    <!-- 腮红 -->
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF6B9D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF6B9D" stop-opacity="0"/>
    </radialGradient>

    <!-- 软阴影 -->
    <radialGradient id="softShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 缩放并居中 -->
  <g transform="translate(48 48) scale(0.6)">
    <!-- 落地阴影 -->
    <ellipse cx="120" cy="218" rx="62" ry="8" fill="url(#softShadow)"/>

    <!-- 顶部凹陷 -->
    <ellipse cx="120" cy="66" rx="10" ry="3.5" fill="#D68910" opacity="0.55"/>

    <!-- 叶子（单片优雅） -->
    <g transform="translate(122 62) rotate(-20)">
      <path d="M 0 0
               C -22 -6, -38 -24, -36 -46
               C -22 -48, -4 -38, 2 -12 Z"
            fill="url(#leaf)"/>
      <!-- 叶脉 -->
      <path d="M -2 -4 Q -16 -22, -30 -40" fill="none" stroke="#3D7A2D" stroke-width="1.4" opacity="0.55" stroke-linecap="round"/>
      <path d="M -10 -14 Q -22 -18, -28 -16" fill="none" stroke="#3D7A2D" stroke-width="0.8" opacity="0.45" stroke-linecap="round"/>
      <path d="M -14 -24 Q -24 -28, -30 -26" fill="none" stroke="#3D7A2D" stroke-width="0.8" opacity="0.45" stroke-linecap="round"/>
      <!-- 叶片高光 -->
      <path d="M -14 -14 Q -24 -26, -28 -36" fill="none" stroke="#D6F2A0" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/>
    </g>

    <!-- 短果柄 -->
    <rect x="118" y="58" width="4" height="8" rx="1.5" fill="#8B6A3C"/>

    <!-- 柚子主体 -->
    <g>
      <!-- 主色 -->
      <circle cx="120" cy="128" r="78" fill="url(#peel)"/>
      <!-- 底部暖反光 -->
      <circle cx="120" cy="128" r="78" fill="url(#botGlow)"/>
      <!-- 左上柔光 -->
      <ellipse cx="92" cy="84" rx="32" ry="22" fill="url(#topLight)"/>
      <!-- 反光点 -->
      <ellipse cx="86" cy="78" rx="6" ry="4" fill="#FFFFFF" opacity="0.85"/>
      <circle cx="86" cy="78" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- 腮红 -->
    <ellipse cx="72"  cy="148" rx="16" ry="10" fill="url(#blush)"/>
    <ellipse cx="168" cy="148" rx="16" ry="10" fill="url(#blush)"/>

    <!-- 大眼睛（睁开的、有神的） -->
    <!-- 左眼 -->
    <g>
      <ellipse cx="92" cy="132" rx="14" ry="16" fill="url(#iris)"/>
      <!-- 瞳孔 -->
      <ellipse cx="92" cy="133" rx="5" ry="11" fill="#0A0420"/>
      <!-- 大高光 -->
      <ellipse cx="86" cy="123" rx="5" ry="6" fill="#FFFFFF"/>
      <!-- 小高光 -->
      <circle cx="98" cy="139" r="2" fill="#FFFFFF" opacity="0.85"/>
      <!-- 眼睑淡阴影（下方） -->
      <path d="M 80 142 Q 92 148, 104 142" fill="none" stroke="#7A4D1F" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    </g>
    <!-- 右眼 -->
    <g>
      <ellipse cx="148" cy="132" rx="14" ry="16" fill="url(#iris)"/>
      <ellipse cx="148" cy="133" rx="5" ry="11" fill="#0A0420"/>
      <ellipse cx="142" cy="123" rx="5" ry="6" fill="#FFFFFF"/>
      <circle cx="154" cy="139" r="2" fill="#FFFFFF" opacity="0.85"/>
      <path d="M 136 142 Q 148 148, 160 142" fill="none" stroke="#7A4D1F" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    </g>

    <!-- 小嘴（俏皮的 o 嘴） -->
    <ellipse cx="120" cy="166" rx="7" ry="6" fill="#5C2A20"/>
    <ellipse cx="120" cy="168" rx="5" ry="3.5" fill="#FF6F8E"/>
  </g>
</svg>
