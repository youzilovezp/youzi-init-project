# Pre-commit hooks for youzi-init-project
# Docs: https://pre-commit.com/
# Install: pre-commit install
# Run all: pre-commit run --all-files
repos:
  # 通用检查：行尾空格、文件末尾换行、merge 冲突标记、大文件、私有 key
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Python：ruff 已通过 .gitignore 暗示在用，这里锁定 lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
        files: "^(scripts/|templates/|tests/)"
      - id: ruff-format
        files: "^(scripts/|templates/|tests/)"

  # 脚手架回归测试：历轮已修 bug 的永久断言（0.7s，零网络零 Docker）
  - repo: local
    hooks:
      - id: scaffold-regression
        name: scaffold regression tests (37 assertions)
        entry: python3 -m pytest tests/ -q
        language: system
        pass_filenames: false
        files: "^(scripts/|templates/|tests/|使用手册|README|安装说明)"
