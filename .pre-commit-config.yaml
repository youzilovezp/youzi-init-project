# Pre-commit hooks for youzi-init-project
# Docs: https://pre-commit.com/
# Install: pre-commit install
# Run all: pre-commit run --all-files
repos:
  # 通用检查：行尾空格、文件末尾换行、merge 冲突标记、大文件、私有 key
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Python：ruff 已通过 .gitignore 暗示在用，这里锁定 lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
        # 模板项目源码（不包含 venv/node_modules）
        files: "^(scripts/|templates/)"
      - id: ruff-format
        files: "^(scripts/|templates/)"

  # Markdown 文档：README / INSTALL / SKILL
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [markdown, yaml]
